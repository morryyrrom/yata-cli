version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ up to date.
  # Cargo dependencies get security updates only (enabled in the repository settings).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
